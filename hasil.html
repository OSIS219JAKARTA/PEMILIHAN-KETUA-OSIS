<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Perolehan Suara - SMPN 219 Jakarta</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .hasil-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: var(--white, #ffffff);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .select-box {
      margin-bottom: 25px;
      text-align: center;
    }
    .select-box select {
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      min-width: 250px;
    }
    .chart-box {
      position: relative;
      margin: 20px 0;
      min-height: 350px;
    }
    .btn-back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <img src="Assets/img/logo_osis.png" alt="Logo">
      <h1>SMPN 219 JAKARTA - HASIL SUARA</h1>
    </div>
  </header>

  <div class="hasil-container">
    <h2 style="text-align: center; color: var(--dark-blue, #1b4f91); margin-bottom: 20px;">
      Live Real-Time Count Hasil Pemilihan
    </h2>

    <div class="select-box">
      <label for="hasil-pemilihan-select" style="font-weight: bold; margin-right: 10px;">Pilih Acara Pemilihan:</label>
      <select id="hasil-pemilihan-select">
        <option value="">Memuat data acara...</option>
      </select>
    </div>

    <div class="chart-box">
      <canvas id="adminBarChart"></canvas>
    </div>

    <div style="text-align: center;">
      <a href="index.html" class="btn-danger btn-back">Kembali ke Menu Utama</a>
    </div>
  </div>

  <footer class="app-footer">&copy; SMPN219JAKARTA. All rights reserved.</footer>

  <script type="module" src="hasil.js"></script>
</body>
</html>
