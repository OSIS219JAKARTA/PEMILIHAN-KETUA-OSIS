<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Perolehan Suara - SMPN 219 Jakarta</title>
  <link rel="icon" type="image/png" href="Assets/img/logo_osis.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .hasil-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 25px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .select-box {
      margin-bottom: 25px;
      text-align: center;
    }
    .select-box select {
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      min-width: 280px;
    }
    .chart-box {
      position: relative;
      margin: 20px 0 40px 0;
      max-height: 400px;
    }
    .total-suara-box {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--dark-blue, #1b4f91);
      margin-bottom: 20px;
      background: #f0f4f9;
      padding: 10px;
      border-radius: 8px;
    }
    /* KARTU GAMBAR HASIL SUARA KANDIDAT */
    .hasil-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .hasil-card {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      background: #fdfdfd;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .hasil-card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .percentage-badge {
      display: inline-block;
      background: var(--dark-blue, #1b4f91);
      color: #ffffff;
      padding: 6px 15px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.2rem;
      margin-top: 8px;
    }
    .vote-detail {
      font-size: 0.9rem;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <img src="Assets/img/logo_osis.png" alt="Logo">
      <h1>SMPN 219 JAKARTA - HASIL SUARA</h1>
    </div>
  </header>

  <div class="hasil-container">
    <h2 style="text-align: center; color: var(--dark-blue, #1b4f91); margin-bottom: 20px;">
      Live Real-Time Count Hasil Pemilihan
    </h2>

    <div class="select-box">
      <label for="hasil-pemilihan-select" style="font-weight: bold; margin-right: 10px;">Pilih Event Pemilihan:</label>
      <select id="hasil-pemilihan-select">
        <option value="">Memuat event...</option>
      </select>
    </div>

    <div id="total-suara-display" class="total-suara-box">
      Total Suara Masuk: 0 Suara
    </div>

    <!-- Grafik Bar Chart Persentase -->
    <div class="chart-box">
      <canvas id="adminBarChart"></canvas>
    </div>

    <h3 style="text-align: center; color: var(--dark-blue, #1b4f91); margin-top: 40px;">
      Ringkasan Persentase Suara Paslon
    </h3>

    <!-- Grid Kartu Foto Paslon & Hasil Persentase -->
    <div id="hasil-cards-container" class="hasil-cards-grid"></div>

    <div style="text-align: center; margin-top: 35px;">
      <a href="index.html" class="btn-danger" style="padding: 10px 25px; text-decoration: none; border-radius: 6px;">Kembali ke Menu Utama</a>
    </div>
  </div>

  <footer class="app-footer">&copy; SMPN219JAKARTA. All rights reserved.</footer>

  <script type="module" src="hasil.js"></script>
</body>
</html>
