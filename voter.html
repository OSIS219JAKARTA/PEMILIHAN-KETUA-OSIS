<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Voter - SMPN 219 Jakarta</title>
  <link rel="stylesheet" href="style.css">
  <style>
  /* KARTU KANDIDAT YANG RAPI & SEJAJAR */
  .candidate-card {
    border: 1px solid var(--gray);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    background: var(--white);
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* SOLUSI FOTO: Tinggi fix 220px, background putih bersih (tanpa warna abu-abu),
     menggunakan contain agar foto utuh, tapi background menyatu dengan kartu */
  .candidate-card img {
    width: 100% !important;
    height: 220px !important;
    object-fit: contain !important; 
    background-color: #ffffff !important; 
    border-radius: 8px !important;
    margin-bottom: 15px !important;
    padding: 5px; 
  }

  /* KONTANINER DUA KOLOM UNTUK VISI MISI & PROKER */
  .vision-proker-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 10px 0 20px 0;
  }

  /* KOTAK VISI MISI DAN PROKER OTOMATIS MEMBESAR KE BAWAH */
  .candidate-info-box {
    background: #f0f4f9;
    padding: 12px;
    border-radius: 6px;
    text-align: left;
    font-size: 0.9rem;
    word-break: break-word;
    white-space: pre-line;
    height: 100%;
  }
  
  /* RESPONSIVE: JADIKAN 1 KOLOM JIKA DI HP */
  @media (max-width: 600px) {
    .vision-proker-container {
      grid-template-columns: 1fr;
    }
  }
</style>

</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <img src="Assets/img/logo_osis.png" alt="Logo">
      <h1>SMPN 219 JAKARTA - VOTER PANEL</h1>
    </div>
  </header>

  <!-- Bagian Form Login Voter -->
  <div id="login-section" class="container-box">
    <h2 style="text-align: center; margin-bottom: 20px; color: var(--dark-blue);">Login Voter</h2>
    <form id="voter-login-form">
      <label for="voter-nis">NIS / Identitas:</label>
      <input type="text" id="voter-nis" required placeholder="Masukkan NIS Anda">

      <label for="voter-password">Password:</label>
      <input type="password" id="voter-password" required placeholder="Masukkan Password">

      <button type="submit" class="btn-primary" style="width: 100%;">Masuk & Mulai Memilih</button>
      <button type="button" class="btn-danger" style="width: 100%; margin-top: 10px;" onclick="location.href='index.html'">Kembali</button>
    </form>
  </div>

  <!-- Bagian Bilik Suara / Voting Section -->
  <div id="voting-section" style="display: none; padding: 40px;">
    <h2 style="text-align: center; color: var(--dark-blue);">Halo, <span id="voter-name-display"></span></h2>
    <p style="text-align: center; margin-bottom: 20px;">Silakan pilih kandidat Ketua & Wakil Ketua OSIS terbaik menurut Anda.</p>

    <div id="candidates-list" class="candidate-grid"></div>
  </div>

  <footer class="app-footer">&copy; SMPN219JAKARTA. All rights reserved.</footer>

  <script type="module" src="voter.js"></script>
</body>
</html>
