<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Voter - SMPN 219 Jakarta</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container-box { max-width: 500px; margin: 60px auto; background: var(--white); padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .candidate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-top: 25px; }
    .candidate-card { border: 1px solid var(--gray); border-radius: 10px; padding: 20px; text-align: center; background: var(--white); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .candidate-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
    .candidate-card h3 { color: var(--dark-blue); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <img src="Assets/img/logo_osis.png" alt="Logo">
      <h1>SMPN 219 JAKARTA - VOTER PANEL</h1>
    </div>
  </header>

  <div id="login-section" class="container-box">
    <h2 style="text-align: center; margin-bottom: 20px; color: var(--dark-blue);">Login Voter</h2>
    <form id="voter-login-form">
      <label for="voter-nis">NIS / Identitas:</label>
      <input type="text" id="voter-nis" required placeholder="Masukkan NIS Anda">
      <label for="voter-password">Password:</label>
      <input type="password" id="voter-password" required placeholder="Masukkan Password">
      <button type="submit" class="btn-primary" style="width: 100%;">Masuk & Mulai Memilih</button>
      <button type="button" class="btn-danger" style="width: 100%; margin-top: 10px;" onclick="location.href='index.html'">Kembali</button>
    </form>
  </div>

  <div id="voting-section" style="display: none; padding: 40px;">
    <h2 style="text-align: center; color: var(--dark-blue);">Halo, <span id="voter-name-display"></span></h2>
    <p style="text-align: center; margin-bottom: 20px;">Silakan pilih kandidat Ketua & Wakil Ketua OSIS terbaik menurut Anda.</p>
    <div id="candidates-list" class="candidate-grid"></div>
  </div>

  <footer class="app-footer">&copy; SMPN219JAKARTA. All rights reserved.</footer>
  <script type="module" src="voter.js"></script>
</body>
</html>
